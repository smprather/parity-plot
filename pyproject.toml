[project]
name = "parity-plot"
version = "0.7.0"
description = "45-degree parity plots from Plotly, as a Python package and a CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kaleido>=1.3.0",
    "plotly>=6.0",
    "rich-click>=1.8",
    "nicegui>=3.14",
    "tomlkit>=0.13",
]


[project.scripts]
parity-plot = "parity_plot.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "ty>=0.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parity_plot"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-include = ["examples/tabbed-report/build-report"]

[tool.ruff.lint]
# E/F/I: pycodestyle errors, pyflakes, isort. Line length (E501) is owned by
# `ruff format`, so it is ignored here. C408 is deliberately NOT selected: the
# plotly-heavy code uses dict(...) as a readable idiom, and rewriting it to
# {...} literals everywhere would be a regression, not an improvement.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ty.src]
# Type-check the shipped library strictly. The tests exercise plotly / nicegui
# objects whose attributes are resolved dynamically (fig.data[i].marker.*) and
# which no type checker can follow, so tests are held to ruff but not to ty.
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NiceGUI's headless `user` fixture is async; without a runner pytest reports it
# as "requested an async fixture with no plugin that handled it".
asyncio_mode = "auto"
markers = ["module_under_test: which module's ui.page routes the user fixture serves"]
