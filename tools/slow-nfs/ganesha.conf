# NFS-Ganesha: a userspace NFS server, so the emulation needs no nfsd in the
# host kernel. All NFS traffic is on TCP 2049, which is what lets tc (or the
# fallback relay) put latency on exactly the NFS traffic and nothing else.
#
# v4 is what the kernel client mounts. v3 is for the fuse-nfs fallback only:
# libnfs's NFSv4 write path fails against Ganesha (ERANGE on every write), its
# v3 path works. The v3 mount protocol gets a fixed port so the fallback can be
# pointed at it; it is used once, at mount time, and is not delayed.

NFS_CORE_PARAM {
    Protocols = 3, 4;
    NFS_Port = 2049;
    MNT_Port = 20048;
    # v3 mounts by the same /export name as v4, not by the backing path.
    Mount_Path_Pseudo = true;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSV4 {
    # No 90 s reclaim window at startup: a fresh server has nothing to reclaim,
    # and in grace every OPEN/CREATE is refused and retried.
    Graceless = true;
    RecoveryBackend = fs;
    Only_Numeric_Owners = true;
}

EXPORT {
    Export_Id = 1;
    Path = /srv/export;
    Pseudo = /export;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Transports = TCP;
    FSAL {
        Name = VFS;
    }
}

LOG {
    Default_Log_Level = EVENT;
}
